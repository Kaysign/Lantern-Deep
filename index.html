<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern Deep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button,.chip,.tab{-webkit-user-select:none;user-select:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body><title>Lantern Deep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: the mine shaft on the left, the miner's ledger (tabs) on the right; stacks into one column on phones.
   One committed look: a dark cave lit by an amber lantern, with rarity colors as the only other hues. */
:root{
  --bg:#0c1214;
  --stone:#141c1e;
  --stone-2:#1b2527;
  --stone-3:#243134;
  --line:#2c3a3c;
  --ink:#f2e8d2;
  --ink-dim:#a6ab9f;
  --ink-faint:#6b746c;
  --lantern:#ffb83f;
  --lantern-hot:#ff8a2a;
  --moss:#86d68f;
  --danger:#ff6f61;
  --r0:#bdb9ab; --r1:#86d68f; --r2:#5fb0ff; --r3:#b884ff; --r4:#ffc53d; --r5:#ff5fa8; --r6:#7ff3ff;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.3px;margin:0;text-wrap:balance}
.wrap{max-width:1320px;margin:0 auto;padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:38px;position:relative;flex:none}
.brand .mark::before{content:"";position:absolute;left:7px;top:0;width:16px;height:6px;border:3px solid var(--ink-dim);border-bottom:0;border-radius:10px 10px 0 0}
.brand .mark::after{content:"";position:absolute;left:3px;top:7px;width:24px;height:30px;border-radius:7px;background:radial-gradient(circle at 50% 55%,#fff3c4 0 18%,var(--lantern) 35%,var(--lantern-hot) 70%,#6b3108 100%);box-shadow:0 0 22px rgba(255,170,60,.55)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--lantern);text-shadow:0 0 20px rgba(255,184,63,.3)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-dim);font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--stone);border:1px solid var(--line);border-radius:10px;padding:5px 12px 6px;min-width:88px}
.stat .k{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-dim);font-weight:800}
.stat .v{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.coins .v{color:var(--lantern)}
.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}.stats{margin-left:0}}

/* Mine */
.mine{min-width:0;display:flex;flex-direction:column;gap:10px}
.shaft{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#050807}
#cv{display:block;width:100%;height:clamp(300px,54vh,560px);touch-action:manipulation;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none}
#cv:focus-visible{box-shadow:inset 0 0 0 3px var(--lantern)}
.ltag{position:absolute;left:14px;top:12px;pointer-events:none;text-shadow:0 2px 8px #000}
.ltag .ln{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--ink-dim)}
.ltag .ld{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.ltag .ld small{font-size:18px;color:var(--ink-dim)}
.ltag .lb{font-size:12px;color:var(--ink-dim);font-weight:700}
.buffs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.buff{background:rgba(10,14,15,.78);border:1px solid var(--bc);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;box-shadow:0 0 14px color-mix(in srgb,var(--bc) 40%,transparent);font-variant-numeric:tabular-nums}
.buff b{color:var(--bc)}
.hp{position:relative;height:26px;border-radius:999px;background:var(--stone);border:1px solid var(--line);overflow:hidden}
.hpf{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#c0392b,#ff7a3d);transition:width .08s linear}
.hp.seal .hpf{background:linear-gradient(90deg,#ff8a2a,#ffd36b)}
.hp.geode .hpf{background:linear-gradient(90deg,#7a4dff,#c9a3ff)}
.hpt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);font-weight:900;margin-right:2px}
.bag{background:var(--stone);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px}
.bag-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.bag-h h3{font-size:18px}
.bag-h .muted{font-size:13px}
.bag-h .btn{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--stone-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink-faint)}
.chip .n{color:var(--ink-dim);font-weight:700}
.empty{color:var(--ink-faint);font-size:13px;padding:4px 2px}

/* Gems & rarity */
.gem{display:inline-block;width:11px;height:11px;transform:rotate(45deg);border-radius:2.5px;background:var(--c);box-shadow:0 0 7px var(--c),inset -2px -2px 0 rgba(0,0,0,.28),inset 2px 2px 0 rgba(255,255,255,.45);flex:none}
.gem.big{width:20px;height:20px;border-radius:4px}
.gem.x6,.t6{animation:hue 3s linear infinite}
.gem.unk{--c:#3a4547;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.t0{color:var(--r0)}.t1{color:var(--r1)}.t2{color:var(--r2)}.t3{color:var(--r3)}.t4{color:var(--r4)}.t5{color:var(--r5)}.t6{color:var(--r6)}

/* Panel */
.panel{background:var(--stone);border:1px solid var(--line);border-radius:16px;min-width:0;display:flex;flex-direction:column}
@media (min-width:921px){.panel{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px)}#tabbody{overflow:auto;overscroll-behavior:contain}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tab{position:relative;border:0;background:transparent;color:var(--ink-dim);font-weight:800;padding:7px 11px;border-radius:9px;cursor:pointer;font-size:14px}
.tab:hover{color:var(--ink);background:var(--stone-2)}
.tab.on{background:var(--stone-3);color:var(--ink)}
.tab .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--lantern);color:#2a1700;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
#tabbody{padding:14px}
.th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.th h2{font-size:24px}
.sub{color:var(--ink-dim);font-size:13.5px;margin:-6px 0 12px;max-width:62ch}
.seg{display:inline-flex;background:var(--stone-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.segb{border:0;background:transparent;color:var(--ink-dim);font-weight:800;font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer}
.segb.on{background:var(--stone-3);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rt{font-weight:900;font-size:15px}
.lv{font-weight:800;font-size:12px;color:var(--ink-dim);margin-left:4px}
.rd{font-size:13px;color:var(--ink-dim)}
.now{color:var(--lantern);font-weight:800}
.btn{background:var(--stone-3);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:900;font-size:13.5px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){border-color:var(--ink-faint)}
.btn.buy{background:linear-gradient(180deg,var(--lantern),var(--lantern-hot));color:#2a1500;border-color:#ffcf7a;min-width:92px}
.btn.buy:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--stone-3);border-color:var(--lantern);color:var(--lantern)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.btn:focus-visible,.tab:focus-visible,.segb:focus-visible,.chip:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.btn:active:not(:disabled){transform:translateY(1px)}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.sec{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);font-weight:900}

/* Pickaxes */
.pk{background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.pk.owned{opacity:.62}
.pk.next{border-color:color-mix(in srgb,var(--lantern) 55%,var(--line));box-shadow:0 0 0 1px rgba(255,184,63,.15),0 0 24px rgba(255,184,63,.08)}
.pk.later{opacity:.8}
.pkicon{width:34px;height:34px;position:relative}
.pkicon::before{content:"";position:absolute;left:15px;top:6px;width:4px;height:27px;border-radius:2px;background:#7a5536;transform:rotate(35deg);transform-origin:50% 30%}
.pkicon::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:11px;border-radius:14px 14px 3px 3px;background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent);transform:rotate(35deg)}
.reqs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.req{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.req.ok{color:var(--moss);border-color:color-mix(in srgb,var(--moss) 45%,var(--line))}
.cur{display:flex;gap:14px;align-items:center;background:radial-gradient(circle at 0% 50%,rgba(255,184,63,.12),transparent 60%),var(--stone-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.cur .pkicon{transform:scale(1.4);margin:0 6px}
.cur .nm{font-family:var(--f-display);font-size:22px}

/* Lantern */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ck{background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.ck .cimg{width:56px;height:56px;background-size:contain;background-repeat:no-repeat;background-position:center}
.ck.gift{border-color:#ffd25a;box-shadow:0 0 16px rgba(255,210,90,.18)}
.ck .cn{font-weight:900;font-size:14px}
.ck .cr{font-size:12px;font-weight:800}
.ck .cp{font-size:11.5px;color:var(--ink-dim);min-height:2.6em}
.ck .ca{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.ck.emptyslot{border-style:dashed;justify-content:center;color:var(--ink-faint);font-size:13px;min-height:150px}
.gtag{font-size:10px;font-weight:900;color:#2a1700;background:#ffd25a;border-radius:999px;padding:1px 6px;vertical-align:2px}
.eggs{display:flex;flex-direction:column;gap:8px}
.eg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.eg.locked{opacity:.55}
.eggi{width:30px;height:38px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.75) 0 12%,transparent 30%),linear-gradient(160deg,var(--e1),var(--e2));box-shadow:0 0 14px color-mix(in srgb,var(--e1) 40%,transparent)}
.odds{font-size:12px;color:var(--ink-dim);display:flex;flex-wrap:wrap;gap:2px 8px}

/* Quests */
.qcard{background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.qcard.done{border-color:color-mix(in srgb,var(--moss) 60%,var(--line))}
.qtop{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.qt{font-weight:900;font-size:15px}
.qr{font-size:12.5px;color:var(--lantern);font-weight:800}
.bar{height:9px;border-radius:999px;background:var(--stone);border:1px solid var(--line);overflow:hidden;margin:9px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),#c4ff6e);border-radius:999px}
.qbot{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

/* Codex */
.cx{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.cxe{display:flex;gap:9px;align-items:center;background:var(--stone-2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.cxe .nm{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cxe .od{font-size:11px;font-weight:800}
.cxe .ct{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.cxe.unk .nm{color:var(--ink-faint)}
.prog{font-size:13px;color:var(--ink-dim)}

/* Rekindle */
.ember{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:radial-gradient(circle at 10% 50%,rgba(255,120,40,.18),transparent 55%),var(--stone-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.ember .big{font-family:var(--f-display);font-size:34px;color:var(--lantern-hot);line-height:1}
.rkc{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 9px;margin-left:6px;border-radius:999px;background:linear-gradient(180deg,var(--lantern),var(--lantern-hot));color:#2a1500;font-size:17px;vertical-align:3px;box-shadow:0 0 14px rgba(255,138,42,.35)}
.ember .lbl{font-size:12px;color:var(--ink-dim);font-weight:800;text-transform:uppercase;letter-spacing:.08em}

/* Trophies */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.ac{background:var(--stone-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ac.got{border-color:color-mix(in srgb,var(--lantern) 55%,var(--line))}
.ac .an{font-weight:900;font-size:13px}
.ac.got .an{color:var(--lantern)}
.ac .ad{font-size:11.5px;color:var(--ink-dim)}
.ac:not(.got){opacity:.55}
.lbt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.lbt td,.lbt th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.lbt th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint)}
.lbt tr.me td{color:var(--lantern);font-weight:900}
.lbt td.r{text-align:right}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sg{background:var(--stone-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.sg .k{font-size:11px;color:var(--ink-faint);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.sg .v{font-weight:900;font-variant-numeric:tabular-nums}

/* Settings */
.set{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:84px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
.ed{background:var(--bg);color:var(--ink);border:1px solid var(--lantern);border-radius:8px;padding:5px 8px;font:inherit;font-weight:800;font-size:13px;width:100%;min-width:0}
.ed:focus{outline:2px solid var(--lantern);outline-offset:1px}
.edrow{display:flex;gap:5px;width:100%;align-items:center}
.ck .sn{font-size:11px;color:var(--ink-faint);font-weight:800}

/* Gear */
.gslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.gs{background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:122px;justify-content:center;min-width:0}
.gs .rt{font-size:13px}
.gs.empty{border-style:dashed;color:var(--ink-faint);font-size:12.5px}
.gs.lock{opacity:.45;border-style:dashed;color:var(--ink-faint);font-size:12px}
.acci{width:30px;height:30px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 8px color-mix(in srgb,var(--c) 40%,transparent);position:relative;flex:none;margin-top:6px}
.acci::after{content:"";position:absolute;left:50%;top:-8px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--c);border-radius:2px}
.acci.unk{--c:#3a4547}
.stars{color:var(--lantern);font-size:12px;letter-spacing:1px}
.fxl{font-size:12px;color:var(--ink-dim)}
.fxl .neg{color:var(--danger)}
.fxl .pos{color:var(--moss)}
.ar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ar.eq{border-color:color-mix(in srgb,var(--lantern) 55%,var(--line))}
.ar.unk{opacity:.6}
.ar .btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.sumfx{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.sumfx span{font-size:12px;font-weight:800;background:var(--stone-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.builds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.bd{background:var(--stone-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bd .bnm{font-weight:900;overflow-wrap:anywhere}
.bd .gl{display:flex;gap:7px;min-height:22px;flex-wrap:wrap;align-items:center}
.bd .gl .acci{width:16px;height:16px;border-width:2px;margin:0}
.bd .gl .acci::after{display:none}
.bd .acts{display:flex;gap:5px;flex-wrap:wrap}

/* Title screen */
#title{position:fixed;inset:0;z-index:65;overflow:auto;background:radial-gradient(ellipse at 50% 22%,rgba(255,150,50,.16),transparent 55%),rgba(5,8,9,.97);backdrop-filter:blur(6px);padding-block:calc(24px + env(safe-area-inset-top,0px)) 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#title[hidden]{display:none}

function deepMerge(base,o){
  if(!o||typeof o!=='object'||Array.isArray(o))return o===undefined?base:o;
  const out=Array.isArray(base)?[]:{...base};
  for(const k in o){const bv=base?base[k]:undefined,ov=o[k];out[k]=(bv&&typeof bv==='object'&&!Array.isArray(bv)&&ov&&typeof ov==='object'&&!Array.isArray(ov))?deepMerge(bv,ov):ov}
  return out;
}
function loadFrom(o){
  const oldV=(o&&o.v)||1;
  S=deepMerge(freshState(),o);
  if(!Array.isArray(S.crit))S.crit=[];
  S.crit=S.crit.filter(c=>c&&SPECIES[c.s]);
  if(!Array.isArray(S.quests))S.quests=[];
  if(!Array.isArray(S.buffs))S.buffs=[];
  if(!Array.isArray(S.equip))S.equip=[];
  S.equip=S.equip.filter(id=>ACC[id]&&S.acc[id]);
  if(!Array.isArray(S.builds)||S.builds.length!==3)S.builds=freshState().builds;
  S.skins.default=1;if(!SKIN[S.skin]||!S.skins[S.skin])S.skin='default';
  if(S.mode==='hardcore')S.hc=Object.assign(freshHc(),S.hc||{});
  // pickaxes are stored by name so new picks can be inserted between old ones
  const byName=PICKS.findIndex(p=>p.name===(oldV<2?OLD_PICKS[o.pick|0]:S.pickName));
  S.pick=byName>=0?byName:clamp(S.pick|0,0,PICKS.length-1);
  S.v=2;

  // quests made before the payout fix: cap the reward, and drop coin quests whose target was inflated too
  S.quests=S.quests.filter(q=>!(q.type==='coins'&&q.target>questCap()*100));
  for(const q of S.quests)q.coins=Math.min(q.coins||0,questCap());
  fillQuests();UI.last={};UI.edit=null;
}

const cupCost=(u,L)=>Math.ceil(u.base*Math.pow(u.g,L));
function spendCurse(cost){
  // pay with the least valuable cursed ores first
  const units=[];for(const id in S.hc.cursed)for(let k=0;k<S.hc.cursed[id];k++)units.push([id,CURSE_W[tierOf(ORE[id].n)]]);
  units.sort((a,b)=>a[1]-b[1]);let paid=0;
  for(const [id,w] of units){if(paid>=cost)break;paid+=w;if(--S.hc.cursed[id]<=0)delete S.hc.cursed[id]}
}
function buyCurseUp(id){
  if(!HC())return;const u=CURSE_UP.find(x=>x.id===id),L=hup(id);if(!u||L>=u.max)return;const c=cupCost(u,L);if(curseHeld()<c)return;
  spendCurse(c);S.hc.up[id]=L+1;if(id==='pact')S.hc.hearts=Math.min(maxHearts(),S.hc.hearts+1);
  sfx.rare(4);toast(`The altar accepts. <b style="color:#c08bff">${esc(u.name)}</b> ${u.max>1?'Lv '+(L+1):''}`,'#8a3dff');
}

// Burn rate and relight price follow the deepest layer reached this run, not the current depth,
// so riding the elevator back up doesn't make the lantern cheaper.
const hcLayer=()=>layerAt(Math.max(S.depth,S.stats.runBest));
const lightDrain=()=>100/360*(1+0.1*hcLayer())*curseMult()*(1-0.08*hup('wick'));
const relightCost=pct=>{const li=hcLayer();return nice(Math.max(3,expectedBlockValue(li,D.luck)*D.coin*0.45*pct*(1+0.35*li)*(1-0.1*hup('ward'))))};
function hcTick(dt){
  const h=S.hc;
  // seal guardians: break the seal before the timer runs out
  if(B.type==='seal'){
    if(!h.seen.guard){h.seen.guard=1;showGuardIntro();return}
    if(B.guard==null)B.guard=guardMax();
    const before=B.guard;B.guard-=dt;
    if(B.guard<10&&Math.ceil(before)!==Math.ceil(B.guard))tone(880,.05,'square',.02);
    if(B.guard<=0){B.guard=guardMax();loseHeart('guard');if(!RUN)return}
  }
  h.calm+=dt;h.light-=lightDrain()*dt;
  if(h.light<20&&h.light>0&&throttle('dim',25000))toast('Your lantern is fading. Relight it in the Lantern tab!','#ff5f7a',5000);
  if(h.light<=0){h.light=0;loseHeart('dark')}
}

function hcOffline(secs){if(!HC()||!(secs>0))return;S.hc.light=Math.max(5,S.hc.light-lightDrain()*Math.min(secs,8*3600))}
function relight(v){
  if(!HC())return;const L=S.hc.light,pct=v==='full'?100-L:Math.min(25,100-L);if(pct<0.5)return;
  const c=relightCost(pct);if(S.coins<c)return;S.coins-=c;S.hc.light=Math.min(100,L+pct);sfx.glint();
}
function loseHeart(reason){
  const h=S.hc;h.hearts--;h.lost++;h.calm=0;FX.shake=20;
  if(S.settings.fx)addFx({type:'flash',col:'#ff2a4a',a:.45,life:.6,max:.6});
  tone(200,.6,'sawtooth',.05,60);
  if(h.hearts<=0){gameOver();return}
  const left=`${h.hearts} ${h.hearts===1?'heart':'hearts'} left`;
  if(reason==='guard')banner('The seal guardian struck','A heart went out',`${left} · the timer resets`,'#ff5f7a');
  else{h.light=40;banner('Your lantern went dark','A heart went out',left,'#ff5f7a')}
}
function sacrifice(i){
  if(!HC()||S.hc.hearts>=maxHearts())return;const c=S.crit[i];if(!c||SPECIES[c.s].r<4)return;
  if(!confirmStep('sac'+i))return;
  if(S.hc.hearts===1)unlockPerma('brink');
  S.hc.hearts++;S.crit.splice(i,1);VIS.splice(i,1);UI.edit=null;
  banner('A heart returns',`${c.n||SPECIES[c.s].name} gave its light`,`${S.hc.hearts} hearts`,'#ff5f7a');sfx.hatch();
}

function saveLocal(){if(CUR===null||!RUN)return;const rec=slotRecord();SLOTS[CUR]=rec;try{localStorage.setItem(SLOT_KEY(CUR),JSON.stringify(rec))}catch(e){}}
function readLocalSlots(){
  for(let i=0;i<3;i++){try{const raw=localStorage.getItem(SLOT_KEY(i));SLOTS[i]=raw?JSON.parse(raw):null}catch(e){SLOTS[i]=null}}
  // one-time move of the single save from the first version into slot 1
  try{const old=localStorage.getItem(KEY);if(old){if(!SLOTS[0]){const o=JSON.parse(old);SLOTS[0]={name:'Slot 1',savedAt:o.savedAt||Date.now(),best:(o.stats&&o.stats.best)||0,play:(o.stats&&o.stats.play)||0,pick:'',json:old};localStorage.setItem(SLOT_KEY(0),JSON.stringify(SLOTS[0]))}localStorage.removeItem(KEY)}}catch(e){}
}

// ================= derived numbers =================
const layerAt=d=>{let i=0;for(let k=0;k<LAYERS.length;k++)if(d>=LAYERS[k].start)i=k;return i};
function blockHP(d){const li=layerAt(d),L=LAYERS[li],nx=LAYERS[li+1];const span=nx?nx.start-L.start:3000;return 4*Math.pow(13,li+(d-L.start)/span)}
const codexCount=()=>Object.keys(S.codex).length;
const achCount=()=>Object.keys(S.ach).length;
const maxSlots=()=>3+S.slotsBought+(S.perks.wick||0);
function buffMult(){
  const now=Date.now(),m={power:1,luck:1,swarm:1,coin:1};
  for(const b of S.buffs){if(b.until<=now)continue;
    if(b.id==='frenzy')m.power*=7;else if(b.id==='lucky')m.luck*=8;else if(b.id==='swarm')m.swarm*=10;
    else if(b.id==='surge'){m.power*=3;m.luck*=3;m.swarm*=3;m.coin*=3}}
  return m;
}
const accSlots=()=>3+(S.stats.best>=700?1:0)+(S.stats.best>=3000?1:0);
const starMult=s=>1+0.25*(s-1);
function accFx(a,stars){const o={};for(const k in a.fx){const v=a.fx[k];o[k]=v>0?v*starMult(stars||1):v}return o}
// hardcore halves the upside of gear (penalties stay full)
function accStats(){const t={},hm=S.mode==='hardcore'?0.5:1;for(const id of S.equip){const a=ACC[id];if(!a||!S.acc[id])continue;const f=accFx(a,S.acc[id]);for(const k in f)t[k]=(t[k]||0)+(f[k]>0?f[k]*hm:f[k])}return t}
function derive(){
  const p=PICKS[S.pick],up=S.up,pk=S.perks,A=accStats(),am=k=>Math.max(0.1,1+(A[k]||0));
  const hcm=S.mode==='hardcore',PM=permaStats(),pm=k=>1+(PM[k]||0);
  // Cursed Altar upgrades (hardcore only) fold into the perma multipliers
  if(hcm&&S.hc){PM.power=(PM.power||0)+0.25*hup('hex');PM.coins=(PM.coins||0)+0.1*hup('fortune');PM.luck=(PM.luck||0)+0.1*hup('sight')}
  let cPow=0,cLuck=0,cCoin=0,cCrit=0,cRoll=0,hits=0;
  for(const c of S.crit){const sp=SPECIES[c.s];if(!sp)continue;
    hits+=sp.rate*(1+0.3*(c.l-1))*(c.g?2:1);
    const v=sp.v*(1+0.08*(c.l-1))*(c.g?1.5:1)*am('kin')*(hcm?0.5:1);
    switch(sp.perk){case'power':cPow+=v;break;case'luck':cLuck+=v;break;case'coins':cCoin+=v;break;case'crit':cCrit+=v;break;case'roll':cRoll+=v;break;case'all':cPow+=v;cLuck+=v;cCoin+=v;break}}
  const unspent=1+0.02*S.embers,ach=1+0.03*achCount(),b=buffMult();
  const power=p.p*Math.pow(1.08,up.sharp||0)*Math.pow(1.3,pk.edge||0)*unspent*ach*(1+cPow)*am('power')*pm('power')*b.power;
  const luck=p.l*(1+0.08*(up.charm||0))*Math.pow(1.2,pk.luck||0)*(1+cLuck)*(1+0.01*codexCount())*am('luck')*pm('luck')*(hcm?0.75:1)*b.luck;
  const coin=(1+0.1*(up.merch||0))*Math.pow(1.35,pk.purse||0)*unspent*ach*(1+cCoin)*am('coins')*pm('coins')*(hcm?0.5:1)*b.coin;
  const extra=0.06*(up.roll||0)+0.25*(pk.haul||0)+cRoll+(A.roll||0);
  const critC=Math.min(0.75,0.015*(up.crit||0)+cCrit+(A.crit||0)+(PM.crit||0)),critM=5+0.5*(up.critdmg||0)+(A.critdmg||0);
  const autoHits=hits*(1+0.1*(up.oil||0))*am('swarm')*pm('swarm')*(hcm?0.6:1)*b.swarm;
  return{power,luck,coin,extra,critC,critM,autoHits,autoDps:power*autoHits*(1+critC*(critM-1)),geode:0.02+0.006*(up.geode||0)+(A.geode||0),offline:0.5*am('offline')*(hcm?0.5:1),glint:am('glint'),acc:A,buffs:b};
}
// What an ordinary block pays: only this layer's everyday ores count. Jackpot ores (1 in 250+)
// would dominate the average and make every reward based on it thousands of times too big.
function expectedBlockValue(li,lk){
  let rv=0,remain=1;
  for(const o of TABLE[li]){if(o.layer!==li||o.n>250)continue;const p=Math.min(1,lk/o.n)*remain;rv+=p*o.v;remain-=p;if(remain<=1e-9)break}
  return ORE[LAYERS[li].rock].v+rv*(1+D.extra);
}
const expBlockCoins=()=>expectedBlockValue(layerAt(S.depth),D.luck)*D.coin;
function reserveMap(){const r={};for(let i=S.pick+1;i<PICKS.length;i++)for(const k in PICKS[i].req)r[k]=Math.max(r[k]||0,PICKS[i].req[k]);return r}

// ================= blocks & mining =================
function makeBlock(d){
  const li=layerAt(d);let type='rock';
  if(d>0&&d%100===0&&d>S.sealMax)type='seal';
  else if(rnd()<(D?D.geode:0.02))type='geode';
  const hp=blockHP(d)*(type==='seal'?10:type==='geode'?3:1);
  return{d,li,type,hp,max:hp,seed:(rnd()*1e9)|0,cracks:genCracks()};
}
function genCracks(){const cr=[];for(let i=0;i<6;i++){let a=rnd()*Math.PI*2,x=(rnd()-.5)*.16,y=(rnd()-.5)*.16;const pts=[[x,y]];for(let k=0;k<5;k++){a+=(rnd()-.5)*1.1;const len=.06+rnd()*.06;x=clamp(x+Math.cos(a)*len,-.45,.45);y=clamp(y+Math.sin(a)*len,-.45,.45);pts.push([x,y])}cr.push(pts)}return cr}
function rollOre(li,lk){for(const o of TABLE[li])if(rnd()<lk/o.n)return o;return null}
function gainCoins(x){S.coins+=x;S.stats.totalCoins+=x}
function applyDamage(dmg){let n=0;while(dmg>0&&n<60){if(dmg>=B.hp){dmg-=B.hp;B.hp=0;breakBlock();n++}else{B.hp-=dmg;dmg=0}}}
function swing(x,y){
  if(!RUN)return;
  S.stats.clicks++;
  const crit=rnd()<D.critC;if(crit)S.stats.crits++;
  const dmg=D.power*(crit?D.critM:1);
  hitFx(x,y,crit,dmg);
  sfx.hit(crit);
  applyDamage(dmg);
}
function breakBlock(){
  const b=B,li=b.li,L=LAYERS[li];
  S.stats.blocks++;
  const lk=D.luck*(b.type==='geode'?3:1);
  let rolls=1+Math.floor(D.extra)+(rnd()<D.extra%1?1:0);
  if(b.type==='geode'){rolls+=5;S.stats.geodes++}
  if(b.type==='seal'){rolls+=12;S.stats.seals++;S.sealMax=b.d}
  const got={},baseN=b.type==='seal'?5:b.type==='geode'?0:1;
  if(baseN)got[L.rock]=baseN;
  for(let i=0;i<rolls;i++){const o=rollOre(li,lk);if(o)got[o.id]=(got[o.id]||0)+1}
  const al=Math.sqrt(D.luck)*(b.type==='geode'?3:b.type==='seal'?5:1)*(HC()?0.5:1);
  if(b.type==='seal'&&HC()){if(S.hc.light<10)unlockPerma('midnight');S.hc.guards=(S.hc.guards||0)+1;toast(`Seal guardian defeated with ${Math.ceil(b.guard==null?guardMax():b.guard)}s to spare.`,'#ffc53d')}
  if(HC())for(const id of Object.keys(got)){const o=ORE[id];if(o.n<250)continue;
    let c=0;for(let k=0;k<got[id];k++)if(rnd()<CURSE_CHANCE)c++;
    if(c){got[id]-=c;if(got[id]<=0)delete got[id];gainCursed(o,c)}}
  for(const a of ACC_BY_LAYER[li])if(rnd()<al/a.n)gainAcc(a,false);
  FX.breaks++;
  let shown=0;
  const ids=Object.keys(got).sort((a,c)=>ORE[c].n-ORE[a].n);
  for(const id of ids){addOre(ORE[id],got[id]);
    if(FX.breaks<=2&&shown<3&&id!==L.rock){floatText('+'+got[id]+' '+ORE[id].name,ORE[id].col,W/2+(rnd()-.5)*60,H*0.52-blockSize()*0.55-shown*18,false);shown++}}
  if(b.type==='seal'){const bonus=expBlockCoins()*25;gainCoins(bonus);toast(`Strata Seal broken at ${fmt(b.d)} m. <b class="t4">+${fmt(bonus)} coins</b>`,RCOL[4]);sfx.seal()}
  else if(b.type==='geode'&&throttle('geode',4000))toast('Geode cracked open. Bonus ore inside.',RCOL[3]);
  const prevBest=S.stats.best;
  if(!S.anchor)S.depth++;
  S.stats.runBest=Math.max(S.stats.runBest,S.depth);
  if(S.depth>S.stats.best){S.stats.best=S.depth;const nl=layerAt(S.depth);if(LAYERS[nl].start===S.depth&&S.depth>prevBest)banner('Now entering',LAYERS[nl].name,`${fmt(S.depth)} m below the surface`,'#ffb83f')}
  burst(b,ids);
  if(curSkin().split&&S.settings.fx&&RT.c&&FX.breaks<=2&&!FX.ghost)FX.ghost={c:RT.c,size:blockSize(),a:rnd()*Math.PI,life:.55,max:.55};
  B=makeBlock(S.depth);
  FX.descend=S.anchor?0.55:0;
  if(FX.breaks<=1)sfx.brk();
}
function addOre(o,n){
  S.inv[o.id]=(S.inv[o.id]||0)+n;
  S.stats.found[o.id]=(S.stats.found[o.id]||0)+n;
  if(!S.codex[o.id]){S.codex[o.id]=1;toast(`New in your codex: ${gemHtml(o)} <b>${esc(o.name)}</b>`,o.col)}
  if(!o.n)return;
  const t=tierOf(o.n);
  if(t>S.stats.maxTier)S.stats.maxTier=t;
  if(t>=4){banner(RAR[t]+' find!',o.name,`1 in ${fmt(o.n)}`,RCOL[t]);sfx.rare(t)}
  else if(t>=3&&throttle('r'+o.id,6000)){toast(`<span class="t${t}">${RAR[t]}!</span> ${gemHtml(o)} <b>${esc(o.name)}</b> <span class="faint">1 in ${fmt(o.n)}</span>`,RCOL[t]);sfx.rare(t)}
}
function fxText(k,v){if(k==='critdmg')return`+${v}× crit damage`;return`${v>0?'+':'−'}${pct(Math.abs(v))} ${FXNAME[k]}`}
function fxHtml(f){return Object.keys(f).map(k=>`<span class="${f[k]<0?'neg':'pos'}">${fxText(k,f[k])}</span>`).join(' · ')}
function gainAcc(a,shop){
  const s=S.acc[a.id]||0;
  if(s>=MAXSTAR){const v=expBlockCoins()*300;gainCoins(v);if(throttle('melt'+a.id,5000))toast(`Spare ${esc(a.name)} sold for <b class="t4">+${fmt(v)} coins</b>. It's already 5★.`,RCOL[a.r]);return}
  S.acc[a.id]=s+1;
  if(shop)return;
  if(!s){banner('Accessory found!',a.name,Object.keys(a.fx).map(k=>fxText(k,a.fx[k])).join(' · '),RCOL[a.r]);sfx.rare(Math.max(3,a.r))}
  else{toast(`Another <b class="t${a.r}">${esc(a.name)}</b>! Upgraded to ${s+1}★.`,RCOL[a.r]);sfx.rare(3)}
}
function sellAll(quiet){
  const res=reserveMap();let total=0;
  for(const id in S.inv){const sell=S.inv[id]-(res[id]||0);if(sell>0){S.inv[id]-=sell;total+=ORE[id].v*sell}if(S.inv[id]<=0)delete S.inv[id]}
  total*=D.coin;
  if(total>0){gainCoins(total);if(!quiet){sfx.sell();floatText('+'+fmt(total)+' coins','#ffb83f',W/2,H*0.2,true)}else if(S.settings.fx)floatText('+'+fmt(total),'#ffb83f',W*0.5,H*0.14,false)}
  else if(!quiet)toast('Nothing to sell yet. Ore you need for pickaxes stays in the bag.');
}
function sellOre(id){
  const keep=reserveMap()[id]||0,n=(S.inv[id]||0)-keep;
  if(n<=0){toast(`Keeping your ${esc(ORE[id].name)} for a pickaxe recipe.`);return}
  S.inv[id]-=n;if(S.inv[id]<=0)delete S.inv[id];
  const v=ORE[id].v*n*D.coin;gainCoins(v);sfx.sell();
  floatText('+'+fmt(v)+' coins','#ffb83f',W/2,H*0.2,true);
}

// ================= purchases =================
const upCost=(u,L)=>u.base*Math.pow(u.g,L);
function buyQty(u,L,amt){
  const room=u.max-L;if(room<=0)return{n:0,cost:0};
  if(amt==='1')return{n:1,cost:upCost(u,L)};
  if(amt==='10'){let n=Math.min(10,room),c=0;for(let i=0;i<n;i++)c+=upCost(u,L+i);return{n,cost:c}}
  let n=0,c=0;while(n<room&&n<1000){const nc=upCost(u,L+n);if(c+nc>S.coins)break;c+=nc;n++}
  return n?{n,cost:c}:{n:1,cost:upCost(u,L)};
}
function buyUpgrade(id){
  const u=UPGRADES.find(x=>x.id===id),L=S.up[id]||0,q=buyQty(u,L,S.settings.buy);
  if(!q.n||S.coins<q.cost)return;
  S.coins-=q.cost;S.up[id]=L+q.n;sfx.buy();
}
function craft(i){
  if(i!==S.pick+1)return;const p=PICKS[i];
  if(S.coins<p.cost)return;for(const k in p.req)if((S.inv[k]||0)<p.req[k])return;
  S.coins-=p.cost;for(const k in p.req){S.inv[k]-=p.req[k];if(S.inv[k]<=0)delete S.inv[k]}
  S.pick=i;sfx.hatch();banner('Crafted',p.name,`Power ${fmt(p.p)} · Luck ×${p.l}`,p.col);
}
const eggCost=e=>e.base*Math.pow(e.g,S.eggBuys[e.id]||0);
const bestEgg=()=>{let b=EGGS[0];for(const e of EGGS)if(S.stats.best>=e.unlock)b=e;return b};
function hatch(id){
  const e=EGG[id];if(!e||S.stats.best<e.unlock)return;
  if(S.crit.length>=maxSlots()){toast('Your lantern is full. Release a glowkin or add a slot.','#ff6f61');return}
  if((S.freeEggs[id]||0)>0)S.freeEggs[id]--;
  else{const c=eggCost(e);if(S.coins<c)return;S.coins-=c;S.eggBuys[id]=(S.eggBuys[id]||0)+1}
  const r=weighted(e.w.map((w,i)=>[i,w]).filter(p=>p[1]>0));
  const pool=Object.keys(SPECIES).filter(k=>SPECIES[k].r===r);
  const s=pool[Math.floor(rnd()*pool.length)];
  const g=rnd()<(1/30)*Math.pow(1.5,S.perks.gild||0);
  S.crit.push({s,l:1,g});S.stats.hatched++;if(g)S.stats.gifted++;
  showHatch(e,s,g);
}
const lvlCost=c=>LVBASE[SPECIES[c.s].r]*Math.pow(1.85,c.l-1)*(c.g?1.5:1);
function levelCritter(i){const c=S.crit[i];if(!c||c.l>=MAXLV)return;const k=lvlCost(c);if(S.coins<k)return;S.coins-=k;c.l++;sfx.buy()}
function release(i){
  if(!confirmStep('rel'+i))return;
  const c=S.crit[i];if(!c)return;const v=LVBASE[SPECIES[c.s].r]*c.l*0.5;
  S.crit.splice(i,1);VIS.splice(i,1);gainCoins(v);UI.edit=null;toast(`${esc(c.n||SPECIES[c.s].name)} flew off into the dark. +${fmt(v)} coins`);
}
const slotCost=()=>150*Math.pow(5,S.slotsBought);
function buySlot(){if(S.slotsBought>=9)return;const c=slotCost();if(S.coins<c)return;S.coins-=c;S.slotsBought++;sfx.buy()}
function elevator(li){
  const L=LAYERS[li];if(!L||L.start>S.stats.runBest)return;
  S.depth=L.start;B=makeBlock(S.depth);FX.descend=0;FX.scroll=S.depth*46;
  toast(`Elevator down to ${esc(L.name)} (${fmt(L.start)} m).`);
}
// rekindle
function emberGain(){const d=S.stats.runBest;return d<300?0:Math.floor(Math.pow(d/100,1.7)*(1+(permaStats().embers||0))*(HC()?0.6:1))}
function rekindle(){
  const g=emberGain();if(!g)return;if(!confirmStep('rekindle'))return;
  S.embers+=g;S.stats.embersTotal+=g;S.stats.rekindles++;
  const st=START[S.perks.start||0];

const QSTAT={blocks:'blocks',swings:'clicks',coins:'totalCoins',crits:'crits',geodes:'geodes',hatch:'hatched'};
function makeQuest(){
  const li=layerAt(S.depth);
  const type=weighted([['blocks',3],['ore',3],['depth',S.anchor?0.6:2],['swings',2],['coins',2],['crits',D.critC>0?1:0],['geodes',1],['hatch',S.crit.length<maxSlots()?0.5:0.15]]);
  const q={type,base:0,target:1,ore:null};
  switch(type){
    case'blocks':q.target=Math.round((60+rnd()*90)*(1+li*0.4));break;
    case'ore':{const pool=TABLE[li].filter(o=>o.layer===li&&o.n<=150);const o=pool[Math.floor(rnd()*pool.length)];q.ore=o.id;q.target=Math.max(2,Math.round((5+rnd()*5)*25/o.n));q.base=S.stats.found[o.id]||0;break}
    case'depth':q.target=S.depth+40+Math.floor(rnd()*60);break;
    case'swings':q.target=300+100*Math.floor(rnd()*8);break;
    case'coins':q.target=nice(expBlockCoins()*(200+rnd()*200));break;
    case'crits':q.target=25+5*Math.floor(rnd()*8);break;
    case'geodes':q.target=2+Math.floor(rnd()*3);break;
    case'hatch':q.target=2+Math.floor(rnd()*2);break;
  }
  if(QSTAT[type])q.base=S.stats[QSTAT[type]]||0;
  q.coins=nice(questCap()*(0.5+rnd()*0.5));
  q.egg=rnd()<0.05?bestEgg().id:null;
  return q;
}

function qProg(q){if(q.type==='depth')return S.depth;if(q.type==='ore')return(S.stats.found[q.ore]||0)-q.base;return(S.stats[QSTAT[q.type]]||0)-q.base}

  case'swings':return`Swing your pickaxe ${fmt(t)} times`;case'coins':return`Earn ${fmt(t)} coins`;case'crits':return`Land ${t} critical hits`;
  case'geodes':return`Crack ${t} geode${t>1?'s':''}`;case'hatch':return`Hatch ${t} egg${t>1?'s':''}`}}

function buildTexture(size){
  const c=document.createElement('canvas'),px=Math.ceil(size*DPR);c.width=c.height=px;
  const g=c.getContext('2d');g.scale(DPR,DPR);
  const L=LAYERS[B.li],R=mulberry(B.seed),s=size,r=s*0.17;
  const poly=(x,y,rad,n,col)=>{g.fillStyle=col;g.beginPath();for(let k=0;k<n;k++){const a=k/n*Math.PI*2+R()*0.6,rr2=rad*(0.6+R()*0.5);g[k?'lineTo':'moveTo'](x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}g.closePath();g.fill()};
  rr(g,0,0,s,s,r);g.save();g.clip();
  if(B.type==='seal'){
    let gr=g.createLinearGradient(0,0,s,s);gr.addColorStop(0,'#2a1f19');gr.addColorStop(1,'#0e0907');g.fillStyle=gr;g.fillRect(0,0,s,s);
    for(let i=0;i<60;i++)poly(R()*s,R()*s,2+R()*5,6,R()<.5?'rgba(255,255,255,.04)':'rgba(0,0,0,.25)');
    g.shadowColor='#ff9a2a';g.shadowBlur=14;g.strokeStyle='#ffb83f';g.lineWidth=s*0.025;
    g.beginPath();g.arc(s/2,s/2,s*0.3,0,Math.PI*2);g.stroke();
    g.lineWidth=s*0.012;g.setLineDash([s*0.03,s*0.025]);g.beginPath();g.arc(s/2,s/2,s*0.22,0,Math.PI*2);g.stroke();g.setLineDash([]);
    for(let k=0;k<8;k++){const a=k/8*Math.PI*2;g.beginPath();g.moveTo(s/2+Math.cos(a)*s*0.33,s/2+Math.sin(a)*s*0.33);g.lineTo(s/2+Math.cos(a)*s*0.4,s/2+Math.sin(a)*s*0.4);g.stroke()}
    g.lineWidth=s*0.02;g.beginPath();g.moveTo(s/2,s*0.36);g.lineTo(s*0.62,s*0.58);g.lineTo(s*0.38,s*0.58);g.closePath();g.stroke();
    g.beginPath();g.arc(s/2,s*0.52,s*0.025,0,Math.PI*2);g.fillStyle='#ffd27a';g.fill();
    g.shadowBlur=0;
    for(const [bx,by] of [[.1,.1],[.9,.1],[.1,.9],[.9,.9]]){g.fillStyle='#5a4a3c';g.beginPath();g.arc(bx*s,by*s,s*0.03,0,7);g.fill();g.fillStyle='#8a7560';g.beginPath();g.arc(bx*s-1,by*s-1,s*0.012,0,7);g.fill()}
  }else if(B.type==='geode'){
    let gr=g.createLinearGradient(0,0,s,s);gr.addColorStop(0,'#5a5462');gr.addColorStop(1,'#2a2631');g.fillStyle=gr;g.fillRect(0,0,s,s);
    for(let i=0;i<70;i++)poly(R()*s,R()*s,2+R()*6,6,R()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.22)');
    g.fillStyle='#160c22';g.beginPath();g.ellipse(s/2,s/2,s*0.3,s*0.26,0,0,7);g.fill();
    const cols=['#b884ff','#e6d4ff','#8ff0ff','#7a4dff'];
    for(let k=0;k<22;k++){const a=k/22*Math.PI*2+R()*0.2,ex=s/2+Math.cos(a)*s*0.3,ey=s/2+Math.sin(a)*s*0.26,len=s*(0.1+R()*0.12),w=s*0.035;
      const tx=ex-Math.cos(a)*len,ty=ey-Math.sin(a)*len,nx=-Math.sin(a)*w,ny=Math.cos(a)*w;
      g.fillStyle=cols[k%cols.length];g.beginPath();g.moveTo(ex+nx,ey+ny);g.lineTo(tx,ty);g.lineTo(ex-nx,ey-ny);g.closePath();g.fill();
      g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(ex+nx*.3,ey+ny*.3);g.lineTo(tx,ty);g.lineTo(ex,ey);g.closePath();g.fill()}
    for(let k=0;k<6;k++){g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(s/2+(R()-.5)*s*0.4,s/2+(R()-.5)*s*0.35,1+R()*1.4,0,7);g.fill()}
  }else{
    let gr=g.createLinearGradient(0,0,s,s);gr.addColorStop(0,shade(L.rockA,0.08));gr.addColorStop(1,L.rockB);g.fillStyle=gr;g.fillRect(0,0,s,s);
    for(let i=0;i<90;i++)poly(R()*s,R()*s,2+R()*7,5+(R()*3|0),R()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.2)');
    const pool=TABLE[B.li].filter(o=>o.layer===B.li),wts=pool.map(o=>[o,1/Math.pow(o.n,0.7)]);
    const n=6+(R()*7|0);
    for(let i=0;i<n;i++){let t=0;for(const w of wts)t+=w[1];let q=R()*t,o=pool[0];for(const w of wts){if((q-=w[1])<0){o=w[0];break}}
      const x=s*0.12+R()*s*0.76,y=s*0.12+R()*s*0.76,rad=3+R()*5;
      g.shadowColor=o.col;g.shadowBlur=o.n>=40?8:0;poly(x,y,rad,5+(R()*3|0),o.col);g.shadowBlur=0;

  }
  g.restore();
  const bev=g.createLinearGradient(0,0,0,s);bev.addColorStop(0,'rgba(255,255,255,.22)');bev.addColorStop(0.5,'rgba(255,255,255,0)');bev.addColorStop(1,'rgba(0,0,0,.45)');

function morph(from,to){
  const a=from.childNodes,b=to.childNodes;
  while(a.length>b.length)from.removeChild(from.lastChild);
  for(let i=0;i<b.length;i++){const n=b[i],o=a[i];
    if(!o){from.appendChild(n.cloneNode(true));continue}
    if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName){from.replaceChild(n.cloneNode(true),o);continue}
    if(n.nodeType===3){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue}
    if(n.nodeType===1){
      for(const at of [...o.attributes])if(!n.hasAttribute(at.name))o.removeAttribute(at.name);
      for(const at of n.attributes)if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
      if(o.tagName==='BUTTON')o.disabled=n.hasAttribute('disabled');
      if(o.tagName==='TEXTAREA'||o.tagName==='INPUT')continue;
      morph(o,n);
    }
  }
}

  const ds=b.dataset,a=ds.act;audio();
  switch(a){
    case'tab':UI.tab=ds.id;$('#tabbody').scrollTop=0;break;
    case'buyamt':S.settings.buy=ds.v;break;
    case'up':buyUpgrade(ds.id);break;
    case'craft':craft(+ds.i);break;
    case'elev':elevator(+ds.i);break;
    case'anchor':S.anchor=!S.anchor;break;
    case'sellall':sellAll(false);break;
    case'sell':sellOre(ds.id);break;
    case'hatch':hatch(ds.id);break;
    case'slot':buySlot();break;
    case'lvl':levelCritter(+ds.i);break;
    case'rel':release(+ds.i);break;
    case'claim':claimQuest(+ds.i);break;
    case'swap':swapQuest(+ds.i);break;
    case'rekindle':rekindle();break;
    case'perk':buyPerk(ds.id);break;
    case'sound':S.settings.sound=!S.settings.sound;break;
    case'fx':S.settings.fx=!S.settings.fx;break;
    case'sci':S.settings.sci=!S.settings.sci;break;
    case'export':{const io=$('#io');io.value=btoa(unescape(encodeURIComponent(serialize())));io.select();break}
    case'copy':{const io=$('#io');if(!io.value)io.value=btoa(unescape(encodeURIComponent(serialize())));const done=()=>toast('Save code copied.');
      try{navigator.clipboard.writeText(io.value).then(done,()=>{io.select();toast('Press Ctrl+C to copy the selected code.')})}catch(err){io.select();toast('Press Ctrl+C to copy the selected code.')}break}
    case'import':{if(HC()){toast("Hardcore saves can't import a save code.",'#ff6f61');break}const v=$('#io').value.trim();if(!v){toast('Paste a save code first.','#ff6f61');break}
      try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||typeof o!=='object'||!o.stats)throw 0;const nm=S.slotName;loadFrom(o);S.slotName=nm;saveLocal();toast('Save loaded into this slot.','#86d68f')}catch(err){toast("That code didn't load. Check that you copied all of it.",'#ff6f61')}break}
    case'reset':if(confirmStep('reset')){const nm=S.slotName,md=S.mode;S=freshState();S.slotName=nm;if(md==='hardcore'){S.mode=md;S.hc=freshHc()}VIS=[];D=derive();B=makeBlock(0);fillQuests();FX.scroll=0;saveLocal();toast('Fresh start. Click the rock to dig.')}break;
    case'close':closeModal();break;
    case'edit':startEdit(ds.kind,+ds.i);break;
    case'edsave':saveEdit();break;
    case'edcancel':UI.edit=null;break;
    case'equip':toggleEquip(ds.id);break;
    case'buyacc':buyAcc(ds.id);break;
    case'savebuild':saveBuild(+ds.i);break;
    case'loadbuild':loadBuild(+ds.i);break;
    case'slotplay':playSlot(+ds.i);break;
    case'slotdelask':UI.delSlot=+ds.i;UI.edit=null;break;
    case'slotdelno':UI.delSlot=null;break;
    case'slotdel':deleteSlot(+ds.i);break;
    case'toslots':toSlots();break;
    case'crate':openCrate(ds.id);break;
    case'slotmode':{const pm=UI.pickMode;UI.pickMode=null;if(pm)newGame(pm.i,pm.name,ds.mode==='hardcore'&&META.hc?'hardcore':'normal');break}
    case'slotmodeno':UI.pickMode=null;break;
    case'relight':relight(ds.v);break;
    case'cup':buyCurseUp(ds.id);break;
    case'sellcurse':if(HC())sellCursed(ds.id);break;
    case'sac':sacrifice(+ds.i);break;
    case'gameover':closeModal();UI.title=true;break;
    case'skin':if(S.skins[ds.id]){S.skin=ds.id;UI.preview=null;sfx.buy()}break;
    case'skinpreview':if(RUN&&SKIN[ds.id]){UI.preview={id:ds.id,until:Date.now()+8000};toast(`Previewing ${esc(SKIN[ds.id].name)} for 8 seconds. Swing at the rock!`,RCOL[SKIN[ds.id].r])}break;
  }
  if(ds.close)closeModal();
  UI.last={};renderUI();
});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='ed'){if(e.key==='Enter'){e.preventDefault();saveEdit();UI.last={};renderUI()}else if(e.key==='Escape'){UI.edit=null;UI.last={};renderUI()}}});

// ================= save slots =================
function startRun(){FX.fx=[];FX.parts=[];FX.texts=[];FX.ghost=null;FX.shake=0;RUN=true;UI.title=false;UI.pickMode=null;UI.delSlot=null;UI.edit=null;FX.scroll=S.depth*46;last=performance.now();UI.last={};renderUI();postBoard()}
function playSlot(i){
  const r=SLOTS[i];if(!r)return;
  try{loadFrom(JSON.parse(r.json))}catch(e){toast("That save couldn't be read.",'#ff6f61');return}
  S.slotName=r.name;CUR=i;startRun();
  const away=(Date.now()-(S.lastSeen||Date.now()))/1000;hcOffline(away);offlineGain(away,true);
  if(HC()&&!S.hc.seen.intro&&$('#modal').hidden)showHcIntro();
}
function newGame(i,name,mode){
  S=freshState();S.slotName=name;if(mode==='hardcore'){S.mode='hardcore';S.hc=freshHc()}VIS=[];D=derive();B=makeBlock(0);fillQuests();CUR=i;RUN=true;saveLocal();saveCloud();startRun();
  if(HC())showHcIntro();
  toast('Click the rock to start digging.','#ffb83f',6000);
}
function renameSlot(i,name){const r=SLOTS[i];if(!r)return;r.name=name;try{const o=JSON.parse(r.json);o.slotName=name;r.json=JSON.stringify(o)}catch(e){}
  try{localStorage.setItem(SLOT_KEY(i),JSON.stringify(r))}catch(e){}
  if(CL.ready)CL.db.doc('data/users/'+CL.uid+'/slot'+i).set(r).catch(()=>{});}
function deleteSlot(i){
  SLOTS[i]=null;UI.delSlot=null;try{localStorage.removeItem(SLOT_KEY(i))}catch(e){}
  if(CL.ready)CL.db.doc('data/users/'+CL.uid+'/slot'+i).delete().catch(()=>{});
  toast('Save deleted.');
}
function toSlots(){saveLocal();saveCloud();RUN=false;CUR=null;FX.glint=null;closeModal();UI.title=true;UI.edit=null}
cv.addEventListener('pointerdown',e=>{
  if(e.button>0)return;e.preventDefault();cv.focus({preventScroll:true});audio();
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(FX.glint&&Math.hypot(x-FX.glint.fx*W,y-FX.glint.fy*H)<40){clickGlint();return}
  const s=blockSize(),inside=Math.abs(x-W/2)<s/2&&Math.abs(y-H*0.52)<s/2;
  swing(inside?x:W/2+(rnd()-.5)*s*0.4,inside?y:H*0.52+(rnd()-.5)*s*0.4);
});
cv.addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='Enter')&&!e.repeat){e.preventDefault();if(FX.glint&&e.key==='Enter'){clickGlint();return}swing(W/2+(rnd()-.5)*40,H*0.52+(rnd()-.5)*40)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

// ================= cloud: account save + leaderboard =================
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    CL.db=db;CL.user=user;CL.uid=id;
    try{
      const base='data/users/'+id+'/';
      const snaps=await Promise.all([0,1,2].map(i=>db.doc(base+'slot'+i).get()));
      let any=false;
      snaps.forEach((snap,i)=>{if(!snap.exists)return;const r=snap.data();if(!r||typeof r.json!=='string')return;any=true;
        if(!SLOTS[i]||(r.savedAt||0)>(SLOTS[i].savedAt||0)){SLOTS[i]={name:r.name||`Slot ${i+1}`,savedAt:r.savedAt||0,best:r.best||0,play:r.play||0,pick:r.pick||'',json:r.json};try{localStorage.setItem(SLOT_KEY(i),JSON.stringify(SLOTS[i]))}catch(e){}}});
      // one-time move of the first version's account save into slot 1
      const old=await db.doc(base+'save').get();
      if(old.exists){const x=old.data();if(!any&&!SLOTS[0]&&x&&typeof x.json==='string'){const o=JSON.parse(x.json);SLOTS[0]={name:'Slot 1',savedAt:x.savedAt||Date.now(),best:(o.stats&&o.stats.best)||0,play:(o.stats&&o.stats.play)||0,pick:'',json:x.json};
          try{localStorage.setItem(SLOT_KEY(0),JSON.stringify(SLOTS[0]))}catch(e){}await db.doc(base+'slot0').set(SLOTS[0])}
        await db.doc(base+'save').delete()}
      // perma-trophies and the hardcore unlock are shared: merge account and this browser
      const ms=await db.doc(base+'meta').get();
      if(ms.exists){const m=ms.data()||{};META.hc=META.hc||!!m.hc;META.perma=Object.assign({},m.perma||{},META.perma)}
      CL.ready=true;CL.lastCloud='';saveMeta();
    }catch(e){}
    CL.syncing=false;UI.last={};
    let timer=setTimeout(()=>{if(!CL.board)CL.board=[]},10000);
    db.collection('board').orderBy('best','desc').limit(25).onSnapshot(snap=>{clearTimeout(timer);CL.board=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
      const mine=CL.board.find(r=>r.id===CL.uid);if(mine){CL.myBest=Math.max(CL.myBest,mine.best||0);CL.myEmbers=Math.max(CL.myEmbers,mine.embers||0);
        if(!CL.minerName&&typeof mine.name==='string'&&mine.name){CL.minerName=mine.name.slice(0,20);try{localStorage.setItem(MINER_KEY,CL.minerName)}catch(e){}}}},()=>{clearTimeout(timer);CL.board=CL.board||[]});
    postBoard();
  }catch(e){}
  CL.syncing=false;
}
async function resolveNames(){if(!CL.user||!CL.board)return;try{CL.names=await CL.user.profiles(CL.board.map(r=>r.id))}catch(e){}}
let cloudBusy=false;
async function saveCloud(){
  if(!CL.ready||cloudBusy||CUR===null||!RUN)return;const slot=CUR,rec=slotRecord();
  const key=slot+'|'+rec.name+'|'+rec.json.replace(/"(savedAt|lastSeen|blockHpFrac|play)":[0-9.e+-]+,?/g,'');
  if(key===CL.lastCloud)return;
  cloudBusy=true;try{await CL.db.doc('data/users/'+CL.uid+'/slot'+slot).set(rec);CL.lastCloud=key}catch(e){}cloudBusy=false;
}
async function postBoard(){
  if(!CL.db||CL.boardFail||!RUN)return;
  const best=Math.max(CL.myBest,S.stats.best),emb=Math.max(CL.myEmbers,S.stats.embersTotal),name=CL.minerName,k=best+'|'+emb+'|'+name;if(k===CL.lastBoardKey)return;
  try{await CL.db.doc('board/'+CL.uid).set({best,embers:emb,name,pick:PICKS[S.pick].name,updatedAt:Date.now()});CL.lastBoardKey=k;CL.myBest=best;CL.myEmbers=emb}catch(e){CL.boardFail=true}
}

// ================= loop =================
const acc={save:0,cloud:0,sec:0,sell:0,ui:0,board:0};
let last=performance.now();
function tick(dt){
  D=derive();
  if(HC()&&!$('#modal').hidden)return;
  S.stats.play+=dt;
  if(D.autoDps>0)applyDamage(D.autoDps*dt);
  if(HC())hcTick(dt);
  if(!RUN)return;
  const now=Date.now();
  if(S.buffs.some(b=>b.until<=now))S.buffs=S.buffs.filter(b=>b.until>now);
  if(!FX.glint&&now>S.nextGlint)spawnGlint();
  if(FX.glint&&now>FX.glint.until){FX.glint=null;scheduleGlint()}
  if((acc.sec+=dt)>=1){acc.sec=0;checkAch();checkMeta()}
  if(S.up.cart&&(acc.sell+=dt)>=3){acc.sell=0;sellAll(true)}
  if((acc.save+=dt)>=5){acc.save=0;saveLocal()}
  if((acc.cloud+=dt)>=45){acc.cloud=0;saveCloud()}
  if((acc.board+=dt)>=60){acc.board=0;postBoard()}
  S.lastSeen=now;
}
let lastHp='';
function frame(nowMs){
  let dt=(nowMs-last)/1000;last=nowMs;
  if(dt>5){if(RUN){hcOffline(dt);offlineGain(dt,false)}dt=0.016}
  dt=Math.min(dt,0.1);
  FX.breaks=0;
  if(RUN)tick(dt);else D=derive();
  draw(dt,nowMs/1000);
  if((acc.ui+=dt)>=0.25){acc.ui=0;renderUI()}
  $('#hpf').style.width=(clamp(B.hp/B.max,0,1)*100).toFixed(2)+'%';
  const hpTxt=`${B.type==='seal'?'Strata Seal'+(HC()&&B.guard!=null?` · Guardian ${Math.ceil(B.guard)}s`:''):B.type==='geode'?'Geode':LAYERS[B.li].name.replace(/^The /,'')+' rock'} · ${fmt(Math.ceil(B.hp))} / ${fmt(B.max)}`;
  if(hpTxt!==lastHp){lastHp=hpTxt;$('#hpt').textContent=hpTxt}
  // hardcore: the whole screen darkens as the lantern burns low
  const dk=$('#dark'),dv=RUN&&HC()&&S.hc.light<50?((1-S.hc.light/50)*0.82*(S.hc.light<12?0.94+0.06*Math.sin(nowMs/90):1)).toFixed(2):'0';
  if(dk.dataset.v!==dv){dk.dataset.v=dv;dk.style.opacity=dv}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&RUN){saveLocal();saveCloud()}});
window.addEventListener('pagehide',saveLocal);

// ================= boot =================
function start(data){
  readLocalSlots();loadMeta();
  try{CL.minerName=(localStorage.getItem(MINER_KEY)||'').slice(0,20)}catch(e){}
  S=freshState();D=derive();B=makeBlock(0);fillQuests();
  makeIcons();resize();
  // a live update of the page keeps the slot you were playing
  let resumed=false;
  if(data&&typeof data.save==='string'&&typeof data.slot==='number'){try{loadFrom(JSON.parse(data.save));CUR=data.slot;RUN=true;resumed=true}catch(e){}}
  if(window.claude&&typeof window.claude.use==='function'){CL.syncing=true;setTimeout(()=>{if(CL.syncing){CL.syncing=false;UI.last={}}},6000)}
  UI.title=!resumed;
  FX.scroll=S.depth*46;
  renderUI();
  last=performance.now();requestAnimationFrame(frame);
  initCloud();
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function')window.claude.hot.snapshot(()=>(RUN&&B&&CUR!==null?{save:serialize(),slot:CUR}:{}));
if(window.claude&&window.claude.hot&&typeof window.claude.hot.ready==='function')window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
